name: build-render-image

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN publishes the package; no extra secrets needed.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/xandernano/nrtr-render
  TAG: blender-4.2.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # The runpod/pytorch base is large; free space so the build and the
      # verification run both fit on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      # Prove the published image actually works: every Blender library
      # resolves and blender --version runs, on the plain runner (no GPU
      # needed for either check).
      - name: Verify the published image
        run: |
          docker pull "${IMAGE}:${TAG}"
          docker run --rm "${IMAGE}:${TAG}" bash -c \
            "ldd /opt/blender-4.2.3-linux-x64/blender && /opt/blender-4.2.3-linux-x64/blender --version" \
            | tee verify.txt
          if grep -q "not found" verify.txt; then
            echo "Unresolved libraries in the published image" >&2
            exit 1
          fi

      - name: Write the evidence summary
        if: always()
        run: |
          {
            echo "## nrtr-render image"
            echo ""
            echo "- Image: \`${IMAGE}:${TAG}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "### Verification (ldd + blender --version inside the published image)"
            echo ""
            echo '```'
            cat verify.txt 2>/dev/null || echo "verify.txt missing, see the verify step log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
